<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash — Chat & Post</title>
<link rel="icon" type="image/svg+xml" href="/icons/splash.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <img class="logo-big splash-logo" src="/icons/splash.svg" alt="">
    <h1 class="logo-text">Splash</h1>
    <p class="tagline">Chat with friends. Post your moments.<br>Make waves. 🌊</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="auth-tab active">Log in</button>
      <button id="tabRegister" class="auth-tab">Sign up</button>
    </div>
    <form id="loginForm" class="auth-form">
      <input id="loginUser" placeholder="Email or username" autocomplete="username" required>
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn-primary" type="submit">Log in</button>
    </form>
    <form id="registerForm" class="auth-form hidden">
      <input id="regName" placeholder="Display name (e.g. Emily)" maxlength="40" required>
      <input id="regEmail" type="email" placeholder="Email address" autocomplete="email" maxlength="254" required>
      <input id="regUser" placeholder="Username (letters, numbers, _)" autocomplete="username" required>
      <input id="regPass" type="password" placeholder="Password (min 8 chars)" autocomplete="new-password" minlength="8" required>
      <div class="picker-row">
        <span>Avatar:</span>
        <div id="avatarPicker" class="emoji-picker"></div>
      </div>
      <div class="picker-row">
        <span>Color:</span>
        <div id="colorPicker" class="color-picker"></div>
      </div>
      <button class="btn-primary" type="submit">Create account</button>
    </form>
    <div id="googleSignIn" class="google-signin hidden"><div class="auth-divider">or</div><div id="googleButton"></div></div>
    <p id="authError" class="error"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-left">
      <img class="logo-sm splash-logo" src="/icons/splash.svg" alt=""><span class="logo-name">Splash</span>
    </div>
    <div class="topbar-search">
      <input id="globalSearch" placeholder="🔍 Search posts, people...">
    </div>
    <div class="topbar-right">
      <button id="bellBtn" class="icon-btn" title="Notifications" aria-label="Notifications"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#bell"></use></svg><span id="bellBadge" class="badge hidden">0</span></button>
      <button id="meBtn" class="me-chip"><span id="meAvatar" class="avatar sm"></span><span id="meName"></span></button>
    </div>
  </header>

  <div id="notifPanel" class="notif-panel hidden"></div>

  <div class="layout">
    <nav class="sidebar">
      <button class="nav-item active" data-view="feed"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#feed"></use></svg> <span>Feed</span></button>
      <button class="nav-item" data-view="chat"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#chat"></use></svg> <span>Chat</span><span id="chatBadge" class="badge hidden">0</span></button>
      <button class="nav-item" data-view="people"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#people"></use></svg> <span>People</span></button>
      <button class="nav-item" data-view="profile"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#profile"></use></svg> <span>Profile</span></button>
      <div class="sidebar-online">
        <h4>Online now</h4>
        <div id="onlineList"></div>
      </div>
      <button id="logoutBtn" class="nav-item logout"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#logout"></use></svg> <span>Log out</span></button>
    </nav>

    <main class="main">
      <!-- FEED -->
      <section id="view-feed" class="view">
        <div class="composer card">
          <div class="composer-top">
            <span id="composerAvatar" class="avatar"></span>
            <textarea id="postInput" placeholder="What's splashing? 💧" rows="2" maxlength="500"></textarea>
          </div>
          <div class="composer-bottom">
            <div id="moodPicker" class="emoji-picker small"></div>
            <span id="charCount" class="char-count">500</span>
            <button id="postBtn" class="btn-primary">Post 💧</button>
          </div>
        </div>
        <div id="storiesRow" class="stories-row"></div>
        <div id="feedList"></div>
      </section>

      <!-- CHAT -->
      <section id="view-chat" class="view hidden">
        <div class="chat-layout">
          <aside class="chat-list card">
            <h3>Chats</h3>
            <div id="chatListItems"></div>
          </aside>
          <div class="chat-pane card">
            <div class="chat-header">
              <button id="chatBack" class="icon-btn mobile-only">←</button>
              <span id="chatTitle" class="chat-title">🌍 Global Chat</span>
              <span id="chatSubtitle" class="chat-subtitle"></span>
            </div>
            <div id="messages" class="messages"></div>
            <div id="typingBar" class="typing-bar"></div>
            <form id="msgForm" class="msg-form">
              <input id="msgInput" placeholder="Type a message..." maxlength="1000" autocomplete="off">
              <button class="btn-primary" type="submit">Send ➤</button>
            </form>
          </div>
        </div>
      </section>

      <!-- PEOPLE -->
      <section id="view-people" class="view hidden">
        <h2 class="view-title">👥 People on Splash</h2>
        <div id="peopleList" class="people-grid"></div>
      </section>

      <!-- PROFILE -->
      <section id="view-profile" class="view hidden">
        <div id="profileContent"></div>
      </section>
    </main>

    <aside class="rightbar">
      <div class="card">
        <h4>💧 About Splash</h4>
        <p class="muted">A friendly place to chat in real time and share posts with your people.</p>
      </div>
      <div class="card">
        <h4>🔥 Trending moods</h4>
        <div id="trending"></div>
      </div>
    </aside>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="feed"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#feed"></use></svg> <span>Feed</span></button>
    <button class="nav-item" data-view="chat"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#chat"></use></svg> <span>Chat</span></button>
    <button class="nav-item" data-view="people"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#people"></use></svg> <span>People</span></button>
    <button class="nav-item" data-view="profile"><svg class="nav-icon" aria-hidden="true"><use href="/icons/nav.svg#profile"></use></svg> <span>Profile</span></button>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/js/app.js"></script>
</body>
</html>
